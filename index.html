          animation: { 'pop': 'pop 0.3s ease-out', 'slide-down': 'slideDown 0.4s ease-out forwards', 'glow-pulse': 'glowPulse 2s infinite' },
          keyframes: {
            pop: { '0%': { transform: 'scale(1)' }, '50%': { transform: 'scale(1.2)' }, '100%': { transform: 'scale(1)' } },
            slideDown: { '0%': { transform: 'translateY(-100%)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },

  <script>
    // ==========================================
    // 1. DATA CONFIGURATION
    // ==========================================
    const categoriesMeta = {
      burgers: { title: "GOURMET BURGERS", sub: "Artisan Brioche Buns & Signature Cheese Sauce" },
      appetizers: { title: "GLOBAL APPETIZERS", sub: "100% Crunchy & Fresh International Sides" },
      panini: { title: "PANINIO & SANDWICH", sub: "Italian Toasted Panini & Grilled Sandwiches" },
      mojitos: { title: "FIZZ'S & MOJITOS", sub: "Sparkling Chill & 100% Natural Fresh Crush" }
    };

    let defaultMenuRegistry = [
      { id: "Classic-Burger", name: "Classic STREET BURGER", category: "burgers", diet: "nonveg", price: 110, tag: "USA Recipe", desc: "Signature American style.", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=700", inStock: true },
      { id: "Virgin-Mojito", name: "Virgin Mojito", category: "mojitos", diet: "cooler", price: 50, tag: "Cuba Classic", desc: "Fresh mint and lemon.", img: "https://images.unsplash.com/photo-1551538827-9c037cb4f32a?w=700", inStock: true }
    ];

    let menuRegistry = []; 
    let cart = [];
    let currentCategory = 'all';
    let currentDiet = 'all';
    let editingItemId = null; 
    let pendingAdminAction = null;

    // Admin PIN Logic (3050)
    const _0xSec = String.fromCharCode(51, 48, 53, 48);
    function getAdminPin() {
      let pin = localStorage.getItem('_secure_admin_key');
      if (!pin) { pin = _0xSec; localStorage.setItem('_secure_admin_key', pin); }
      return pin;
    }

    // ==========================================
    // 2. VERCEL CLOUD SYNC LOGIC
    // ==========================================
    async function loadCustomMenu() {
      try {
        const res = await fetch('/api/menu');
        const liveMenu = await res.json();
        if (liveMenu && liveMenu.length > 0) {
          menuRegistry = liveMenu;
        } else {
          // If DB is empty, initialize with defaults
          menuRegistry = [...defaultMenuRegistry];
          await syncMenuToVercel(); 
        }
      } catch (e) {
        console.error("Vercel API error. Falling back to defaults.", e);
        menuRegistry = [...defaultMenuRegistry];
      }
    }

    async function syncMenuToVercel() {
      try {
        await fetch('/api/menu', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'save_menu', menuData: menuRegistry })
        });
      } catch (e) {
        console.error("Failed to sync to Vercel.", e);
      }
    }

    // Resize image before uploading
    function resizeImageFile(file, maxSize) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } } 
            else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.6));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function saveNewMenuItem() {
      const name = document.getElementById('newItemName').value.trim();
      const price = parseFloat(document.getElementById('newItemPrice').value);
      const fileInput = document.getElementById('newItemImgFile');
      
      if (!name || isNaN(price)) return alert("Provide Name and Price.");
      
      const saveBtn = document.getElementById('btnSaveMenuItem');
      saveBtn.innerText = "Syncing with Cloud...";
      let finalImgUrl = document.getElementById('newItemImgUrl').value.trim();
      
      // Upload photo to Vercel Blob
      if (fileInput.files && fileInput.files[0]) {
        try {
          const base64 = await resizeImageFile(fileInput.files[0], 700);
          const res = await fetch('/api/menu', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'upload_image', imageBase64: base64, extension: 'jpg' })
          });
          const data = await res.json();
          finalImgUrl = data.url; 
        } catch(e) {
          alert("Image upload failed. Try a smaller file.");
          saveBtn.innerText = "Save Item";
          return;
        }
      }
      
      const id = editingItemId || name.replace(/\s+/g, '-') + '-' + Date.now();
      const newItem = {
        id, name, price, 
        category: document.getElementById('newItemCategory').value,
        diet: document.getElementById('newItemDiet').value,
        desc: document.getElementById('newItemDesc').value.trim(),
        tag: document.getElementById('newItemTag').value.trim() || "New",
        img: finalImgUrl || "https://images.unsplash.com/photo-1550547660-d9450f859349?w=700",
        inStock: true
      };

      // Keep stock status if editing
      const existingIdx = menuRegistry.findIndex(i => i.id === editingItemId);
      if (existingIdx >= 0) {
        newItem.inStock = menuRegistry[existingIdx].inStock;
        menuRegistry[existingIdx] = newItem;
      } else {
        menuRegistry.push(newItem);
      }

      await syncMenuToVercel();
      
      editingItemId = null;
      closeAddMenuModal();
      renderMenuCards();
      renderStockManagerRows();
      showToast(name + " is now live!");
      saveBtn.innerText = "Save Item";
    }

    async function toggleStockItem(itemId) {
      const item = menuRegistry.find(i => i.id === itemId);
      if (item) {
        item.inStock = !item.inStock;
        if (!item.inStock) {
          const cIdx = cart.findIndex(c => c.name === item.name);
          if (cIdx !== -1) cart.splice(cIdx, 1);
          localStorage.setItem('sb_cart', JSON.stringify(cart));
          renderCart();
        }
        await syncMenuToVercel();
        renderStockManagerRows();
        renderMenuCards();
      }
    }

    async function deleteMenuItem(id) {
      if(!confirm("Permanently delete this item from the cloud?")) return;
      menuRegistry = menuRegistry.filter(i => i.id !== id);
      await syncMenuToVercel();
      renderStockManagerRows();
      renderMenuCards();
      showToast("Item deleted globally");
    }

    async function resetAllStock() {
      menuRegistry.forEach(i => i.inStock = true);
      await syncMenuToVercel();
      renderStockManagerRows();
      renderMenuCards();
      showToast("All items marked In Stock");
    }

    // ==========================================
    // 3. UI RENDERING & APP LOGIC
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      getAdminPin();
      await loadCustomMenu(); 
      try {
        const savedCart = localStorage.getItem('sb_cart');
        if (savedCart) cart = JSON.parse(savedCart);
      } catch(e){}
      renderMenuCards();
      renderCart();
    });

    function renderMenuCards() {
      const container = document.getElementById('dynamicMenuRoot');
      const search = (document.getElementById('menuSearchInput')?.value || '').toLowerCase().trim();
      const categories = ['burgers', 'appetizers', 'panini', 'mojitos'];
      let totalVisible = 0;

      container.innerHTML = categories.map(cat => {
        if (currentCategory !== 'all' && currentCategory !== cat) return '';
        const meta = categoriesMeta[cat];
        const items = menuRegistry.filter(item => {
          if (item.category !== cat) return false;
          if (currentDiet !== 'all' && item.diet !== currentDiet) return false;
          if (search && !item.name.toLowerCase().includes(search) && !item.desc.toLowerCase().includes(search)) return false;
          return true;
        });

        if (items.length === 0) return '';
        totalVisible += items.length;

        return `
          <div class="menu-group mb-12">
            <h3 class="font-luxury text-3xl text-white font-bold mb-6">${meta.title}</h3>
            <div class="grid grid-cols-2 gap-6">
              ${items.map(item => {
                const isOut = !item.inStock;
                const cartItem = cart.find(c => c.name === item.name);
                const qty = cartItem ? cartItem.qty : 0;

                return `
                  <div class="glass-card overflow-hidden flex flex-col ${isOut ? 'opacity-60' : ''}">
                    <div class="h-48 relative">
                      <img src="${item.img}" class="w-full h-full object-cover">
                      ${isOut ? `<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><span class="bg-red-600 text-white font-bold px-4 py-2 rounded-lg">Sold Out</span></div>` : ''}
                    </div>
                    <div class="p-5 flex-1 flex flex-col justify-between">
                      <div>
                        <h4 class="font-bold text-xl text-white mb-2">${item.name}</h4>
                        <p class="text-sm text-stone-400 mb-4">${item.desc}</p>
                      </div>
                      <div class="flex items-center justify-between">
                        <span class="text-xl font-bold text-brandNeon">₹${item.price}</span>
                        ${!isOut ? `<button onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.price})" class="bg-brandGold text-black font-bold px-4 py-2 rounded-lg">Add</button>` : ''}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('emptyState').classList.toggle('hidden', totalVisible > 0);
    }

    // Modal Operations
    function requestAdminAccess(actionType) {
      pendingAdminAction = actionType;
      if (sessionStorage.getItem('_auth_session_active') === 'true') executeAdminAction();
      else document.getElementById('adminAuthModal').classList.remove('hidden');
    }

    function verifyAdminPin() {
      if (document.getElementById('authCodeInput').value === getAdminPin()) {
        sessionStorage.setItem('_auth_session_active', 'true');
        closeAuthModal();
        executeAdminAction();
      } else alert("Access Denied");
    }

    function closeAuthModal() { document.getElementById('adminAuthModal').classList.add('hidden'); }

    function executeAdminAction() {
      if (pendingAdminAction === 'stock') {
        renderStockManagerRows();
        document.getElementById('stockModal').classList.remove('hidden');
      } else if (pendingAdminAction === 'add_menu') openAddMenuModal();
    }

    function renderStockManagerRows() {
      document.getElementById('stockModalList').innerHTML = menuRegistry.map(item => `
        <div class="flex items-center justify-between p-3 rounded-xl border ${item.inStock ? 'bg-white/5 border-white/10' : 'bg-red-950/30 border-red-500/40'}">
          <div class="flex items-center gap-3 w-1/2">
            <img src="${item.img}" class="w-10 h-10 object-cover rounded-lg">
            <div class="text-sm font-bold text-white truncate">${item.name}</div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button onclick="editMenuItem('${item.id}')" class="bg-blue-500/20 text-blue-400 p-2 rounded-lg"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteMenuItem('${item.id}')" class="bg-red-500/20 text-red-500 p-2 rounded-lg"><i class="fa-solid fa-trash"></i></button>
            <button onclick="toggleStockItem('${item.id}')" class="px-3 py-2 rounded-lg text-xs font-bold ${item.inStock ? 'bg-emerald-600' : 'bg-red-600'} text-white">
              ${item.inStock ? '✔ Stock' : '❌ Out'}
            </button>
          </div>
        </div>
      `).join('');
    }

    function openAddMenuModal() {
      editingItemId = null;
      document.getElementById('addMenuModalTitle').innerHTML = '<i class="fa-solid fa-plus-circle"></i> ADD MENU ITEM';
      ['newItemName', 'newItemPrice', 'newItemTag', 'newItemDesc', 'newItemImgUrl', 'newItemImgFile'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('addMenuItemModal').classList.remove('hidden');
    }

    function editMenuItem(id) {
      const item = menuRegistry.find(i => i.id === id);
      if(!item) return;
      editingItemId = id;
      document.getElementById('addMenuModalTitle').innerHTML = 'EDIT MENU ITEM';
      document.getElementById('newItemName').value = item.name;
      document.getElementById('newItemPrice').value = item.price;
      document.getElementById('newItemCategory').value = item.category;
      document.getElementById('newItemDesc').value = item.desc;
      document.getElementById('newItemImgUrl').value = item.img;
      document.getElementById('newItemImgFile').value = '';
      closeStockModal();
      document.getElementById('addMenuItemModal').classList.remove('hidden');
    }

    function closeAddMenuModal() { document.getElementById('addMenuItemModal').classList.add('hidden'); }
    function closeStockModal() { document.getElementById('stockModal').classList.add('hidden'); }
    
    // Core Utilities
    function toggleCart() { document.getElementById('cartDrawer').classList.toggle('hidden'); }
    function showToast(msg) { 
      const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg;
      document.getElementById('toast-container').appendChild(t);
      setTimeout(() => t.remove(), 2500);
    }
    
    function addToCart(name, price) {
      const existing = cart.find(i => i.name === name);
      if (existing) existing.qty += 1;
      else cart.push({ name, price, qty: 1 });
      localStorage.setItem('sb_cart', JSON.stringify(cart));
      renderCart(); renderMenuCards(); showToast("Added to basket");
    }

    function renderCart() {
      document.getElementById('headerCartCount').innerText = cart.reduce((s,i) => s + i.qty, 0);
      document.getElementById('cartItemsContainer').innerHTML = cart.map((i, idx) => `
        <div class="flex justify-between items-center text-white bg-white/5 p-3 rounded-xl">
          <span>${i.name} (x${i.qty})</span><span>₹${i.price * i.qty}</span>
        </div>
      `).join('');
    }
    
    function filterCategory(cat) { currentCategory = cat; renderMenuCards(); }
    function setDietFilter(diet) { currentDiet = diet; renderMenuCards(); }
    function applyFilters() { renderMenuCards(); }
  </script>
</body>
</html>
